model:
  name: DEMambaNet
  in_channels: 3
  num_classes: 1
  base_channels: 32
  use_mamba_ssm: true
  mamba_stages: [3, 4]
  transformer_stages: [4]
  route_bins: 4
  use_frequency_gate: false
  use_semantic_skip_gate: false
  use_detail_residual_gate: false
  use_structure_harmonic_fusion: false
  use_boundary_logit_calibration: false
  use_edge_mask_consistency_refiner: false
  use_sdf_head: false
  use_deep_supervision: false
  use_retinex_directional_valley_prior: false
  use_route_guided_directional_refiner: false
  use_route_guided_anisotropic_diffusion: false
  use_density_balanced_prototype_context: false
  use_local_route_gate: false
  use_deep_identity_decay: false
  deep_identity_scales:
    stage3: 1.0
    stage4: 1.0

data:
  data_root: ./DeepCrack
  img_size: [512, 512]
  threshold: 127
  target_dir_name: targets
  photometric_augment:
    enabled: false
    probability: 0.0
    brightness: 0.0
    contrast: 0.0
    gamma_range: [1.0, 1.0]
    channel_gain_probability: 0.0
    channel_gain_range: [1.0, 1.0]
    grayscale_probability: 0.0

train:
  epochs: 200
  batch_size: 8
  lr: 0.0001
  weight_decay: 0.0001
  num_workers: 4
  persistent_workers: true
  prefetch_factor: 2
  amp: true
  amp_dtype: fp16
  cudnn_benchmark: true
  torch_compile: false
  fused_adamw: true
  exclude_norm_bias_from_weight_decay: false
  lr_scheduler: cosine
  min_lr: 0.0
  poly_power: 0.9
  use_model_ema: false
  model_ema_decay: 0.999
  val_interval: 1

loss:
  lambda_edge: 0.3
  lambda_tangent: 0.2
  scnp_weight: 0.2
  scnp_warmup_epochs: 10
  scnp_kernel_size: 3
  mask_pos_weight: 1.0
  lambda_sdf: 0.0
  sdf_truncation: 8.0
  lambda_aux_mask: 0.0
  lambda_aux_edge: 0.0
  lambda_tnhnc: 0.0
  tnhnc_start_epoch: 30
  tnhnc_ramp_epochs: 50
  tnhnc_margin: 0.5
  tnhnc_temperature: 0.25
  tnhnc_max_normal_offset: 6
  lambda_bpcm: 0.0
  bpcm_start_epoch: 60
  bpcm_ramp_epochs: 40
  bpcm_margin: 0.5
  bpcm_neg_temperature: 0.5
  lambda_fbhn: 0.0
  fbhn_start_epoch: 100
  fbhn_ramp_epochs: 40
  fbhn_exclusion_kernel_size: 5
  fbhn_topk_per_image: 256
  fbhn_margin: 0.25

evaluation:
  selection_metric: structural_score
  structural_score_weights:
    f1: 0.5
    cldice: 0.3
    boundary_f1: 0.2

save:
  save_dir: ./runs/demambanet
