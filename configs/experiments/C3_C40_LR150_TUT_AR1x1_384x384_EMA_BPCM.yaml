model:
  name: DEMambaNet
  in_channels: 3
  num_classes: 1
  base_channels: 40
  use_mamba_ssm: true
  mamba_stages: [3, 4]
  transformer_stages: [4]
  route_bins: 4
  use_frequency_gate: false
  use_semantic_skip_gate: false
  use_detail_residual_gate: false
  use_structure_harmonic_fusion: false
  use_boundary_logit_calibration: false
  use_local_route_gate: false
  use_deep_identity_decay: false
  deep_identity_scales:
    stage3: 1.0
    stage4: 1.0

data:
  data_root: ./TUT
  # Preserve TUT's native 1:1 aspect ratio without needlessly upscaling its
  # 640x640 patches beyond the established 384-pixel experiment scale.
  img_size: [384, 384]
  threshold: 127
  target_dir_name: targets
  allow_quarter_turns: false
  photometric_augment:
    enabled: true
    probability: 0.5
    brightness: 0.12
    contrast: 0.12
    gamma_range: [0.9, 1.1]

train:
  # 987 train images at batch size 8 yield 123 optimizer steps per epoch.
  # 75 epochs therefore match the 9,200-step DeepCrack C40 training budget.
  epochs: 75
  batch_size: 8
  lr: 0.00015
  weight_decay: 0.0001
  num_workers: 4
  persistent_workers: true
  prefetch_factor: 2
  amp: true
  amp_dtype: fp16
  cudnn_benchmark: true
  torch_compile: false
  fused_adamw: true
  exclude_norm_bias_from_weight_decay: false
  lr_scheduler: cosine
  min_lr: 0.0
  poly_power: 0.9
  use_model_ema: true
  model_ema_decay: 0.999
  val_interval: 1

loss:
  lambda_edge: 0.3
  lambda_tangent: 0.2
  scnp_weight: 0.2
  # 4 epochs x 123 updates approximately match the C40 460-step warmup.
  scnp_warmup_epochs: 4
  scnp_kernel_size: 3
  mask_pos_weight: 1.0
  lambda_tnhnc: 0.0
  lambda_bpcm: 0.025
  # Match the original 2,760/1,840-step BPCM start/ramp timing.
  bpcm_start_epoch: 23
  bpcm_ramp_epochs: 15
  bpcm_margin: 0.5
  bpcm_neg_temperature: 0.5

evaluation:
  selection_metric: structural_score
  structural_score_weights:
    f1: 0.5
    cldice: 0.3
    boundary_f1: 0.2

save:
  save_dir: ./runs/pilot/C3_C40_LR150_TUT_AR1x1_384x384_EMA_BPCM
